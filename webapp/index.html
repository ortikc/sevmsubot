<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#000000">
  <title>Расписание МГУ Севастополь</title>
  <!-- the app on a phone's home screen: installable, and it opens without the internet (sw.js) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Расписание">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
  <script>
    // pick the theme before first paint so the page never flashes the wrong ground
    (function () {
      var pref = "auto";
      try { pref = localStorage.getItem("msu.theme") || "auto"; } catch (e) {}
      var tgScheme = window.Telegram && Telegram.WebApp && Telegram.WebApp.colorScheme;
      var sys = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = pref === "auto" ? (tgScheme || sys) : pref;
    })();
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <nav class="tabbar slide-tabs" id="tabbar" role="tablist" aria-label="Разделы" hidden>
    <span class="slide-cursor" aria-hidden="true"></span>
    <button role="tab" data-tab="schedule"><span class="tab-inner">
      <!-- the calendar leafs through two pages when tapped -->
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="cal-rings" d="M8 2.5v4M16 2.5v4"/><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 10h18"/><path class="cal-lines" d="M7.5 14h3M13.5 14h3M7.5 17.5h3"/><path class="cal-leaf" d="M3.6 10h16.8v8.6a1.9 1.9 0 0 1-1.9 1.9H5.5a1.9 1.9 0 0 1-1.9-1.9Z"/><path class="cal-leaf l2" d="M3.6 10h16.8v8.6a1.9 1.9 0 0 1-1.9 1.9H5.5a1.9 1.9 0 0 1-1.9-1.9Z"/></svg>
      <span class="tab-label">Расписание</span>
    </span></button>
    <button role="tab" data-tab="clubs"><span class="tab-inner">
      <!-- the columns rise one after another and the roof settles on them -->
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="club-roof" d="M3 9.5 12 4l9 5.5"/><path d="M4.5 20.5h15"/><path class="club-col" d="M6 10.5v7"/><path class="club-col c2" d="M10 10.5v7"/><path class="club-col c3" d="M14 10.5v7"/><path class="club-col c4" d="M18 10.5v7"/></svg>
      <span class="tab-label">Вступить</span>
    </span></button>
    <button role="tab" data-tab="profile"><span class="tab-inner">
      <!-- the little person twitches -->
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><g class="me"><circle class="me-head" cx="12" cy="10" r="3.2"/><path d="M6.6 18.6c1.2-2 3.1-3 5.4-3s4.2 1 5.4 3"/></g></svg>
      <span class="tab-label">Профиль</span>
    </span></button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-scrim" data-close></div>
    <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></section>
  </div>

  <script src="app.js"></script>
</body>
</html>
