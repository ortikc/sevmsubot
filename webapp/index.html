<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#000000">
  <title>Расписание МГУ Севастополь</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Crect x='6' y='14' width='20' height='5' rx='2' fill='%23333'/%3E%3Crect x='13' y='14' width='8' height='5' rx='2' fill='%234DA3FF'/%3E%3C/svg%3E">
  <script>
    // pick the theme before first paint so the page never flashes the wrong ground
    (function () {
      var pref = "auto";
      try { pref = localStorage.getItem("msu.theme") || "auto"; } catch (e) {}
      var tgScheme = window.Telegram && Telegram.WebApp && Telegram.WebApp.colorScheme;
      var sys = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = pref === "auto" ? (tgScheme || sys) : pref;
    })();
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <nav class="tabbar slide-tabs" id="tabbar" role="tablist" aria-label="Разделы" hidden>
    <span class="slide-cursor" aria-hidden="true"></span>
    <button role="tab" data-tab="schedule"><span class="tab-inner">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18M7.5 14h3M13.5 14h3M7.5 17.5h3"/></svg>
      <span class="tab-label">Расписание</span>
    </span></button>
    <button role="tab" data-tab="clubs"><span class="tab-inner">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5 12 4l9 5.5M4.5 20.5h15M6 10.5v7M10 10.5v7M14 10.5v7M18 10.5v7"/></svg>
      <span class="tab-label">Вступить</span>
    </span></button>
    <button role="tab" data-tab="profile"><span class="tab-inner">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="10" r="3.2"/><path d="M6.6 18.6c1.2-2 3.1-3 5.4-3s4.2 1 5.4 3"/></svg>
      <span class="tab-label">Профиль</span>
    </span></button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-scrim" data-close></div>
    <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></section>
  </div>

  <script src="app.js"></script>
</body>
</html>
