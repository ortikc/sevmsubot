<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#0B1838;color:#F4F6FB;font-family:'Golos Text',system-ui,sans-serif}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.hd{padding:22px 18px 14px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #F4F6FB}
.hd b{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.hd span{font-size:13px;color:#7FB2FF}
.cols{display:grid;grid-template-columns:70px 1fr 54px;padding:10px 18px;font-size:11px;letter-spacing:.08em;color:#7FB2FF;text-transform:uppercase}
.r{display:grid;grid-template-columns:70px 1fr 54px;align-items:center;padding:16px 18px;border-top:1px solid #213A78;background:#0B1838}
.r .t{font-size:20px;font-weight:700}
.r h3{font-size:16px;font-weight:600}
.r p{font-size:12px;color:#9DB0DA;margin-top:2px}
.r .a{font-size:20px;font-weight:700;text-align:right}
.r.next{background:#16295A;border-left:4px solid #FF8A5B}
.r.next .t,.r.next .a{color:#FF8A5B}
.cd{margin:6px 18px 0;padding:12px 14px;background:#FF8A5B;color:#0B1838;font-weight:700;font-size:15px;display:flex;justify-content:space-between}
.foot{position:absolute;bottom:0;left:0;right:0;padding:14px 18px 28px;border-top:3px solid #F4F6FB;display:flex;justify-content:space-between;font-size:14px;color:#9DB0DA}
.foot b{color:#F4F6FB}
</style></head><body>
<div class="hd"><b>Ср · 21.10</b><span>ПМ-101</span></div>
<div class="cols"><span>Время</span><span>Пара</span><span style="text-align:right">Ауд.</span></div>
<div class="r"><div class="t mono">09:00</div><div><h3>Математический анализ</h3><p>Сем · Лактионова Н. В.</p></div><div class="a mono">172</div></div>
<div class="r next"><div class="t mono">10:40</div><div><h3>Математический анализ</h3><p>Сем · Лактионова Н. В.</p></div><div class="a mono">172</div></div>
<div class="cd"><span>Следующая через</span><span class="mono">28 мин</span></div>
<div class="r"><div class="t mono">12:55</div><div><h3>История России</h3><p>Сем · Белый К. В.</p></div><div class="a mono">205</div></div>
<div class="r"><div class="t mono">14:35</div><div><h3>История России</h3><p>Сем · Белый К. В.</p></div><div class="a mono">205</div></div>
<div class="foot"><span>‹ Вт</span><b>Сегодня</b><span>Чт ›</span></div>
</body></html>
